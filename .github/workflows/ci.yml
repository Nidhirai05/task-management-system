# separate terms of service, privacy policy, and support
# documentation.

# Production DevSecOps CI/CD Pipeline
# Sequence: Setup -> Secret Scan / SAST / FS Scan (Parallel) -> SCA -> Build & SBOM -> Image Security -> Push -> GitOps

name: CI pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:

  #########################################################
  # 1. Setup & Environment Stage
  #########################################################
  setup:
    name: "1. Setup & Environment"
    runs-on: Agent-1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Kept for future flexibility (e.g., unit testing with Maven)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./task-management-system-frontend/package-lock.json

      - name: Verify Host Environment
        run: |
          docker --version
          java -version
          node --version

  #########################################################
  # 2. Secret Scanning (Gitleaks)
  #########################################################
  gitleaks:
    name: "2. Gitleaks Secret Scan"
    runs-on: Agent-1
    needs: setup
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        with:
          exit-code: 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  #########################################################
  # 3. Code Quality & SAST (SonarQube)
  #########################################################
  sonarqube:
    name: "3. SonarQube SAST Scan"
    runs-on: Agent-1
    needs: setup
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

