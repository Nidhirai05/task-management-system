# Production DevSecOps CI/CD Pipeline
# Sequence: Setup -> Secret Scan / SAST / FS Scan (Parallel) -> SCA -> Build & SBOM -> Image Security -> Push -> GitOps

name: CI pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:

  #########################################################
  # 1. Secret Scanning (Gitleaks)
  #########################################################
  gitleaks:
    name: "1. Gitleaks Secret Scan"
    runs-on: Agent-1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  #########################################################
  # 2. Code Quality & Deep SAST Analysis (SonarQube)
  #########################################################
  sonarqube:
    name: "2. SonarQube SAST Scan"
    runs-on: Agent-1
    needs: gitleaks
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for SonarQube git-blame analysis

      # Set up Java 21 inside this job's isolated environment
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: 'backend/pom.xml'

      # Compile Spring Boot backend code to generate bytecode in target/classes
      - name: Compile Backend Bytecode
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw compile -DskipTests

      # Perform Deep Analysis with SonarQube Scan Action v6
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  #########################################################
  # 3. Filesystem Security Scan (Trivy)
  #########################################################
  trivy-fs:
    name: "3. Trivy Filesystem Scan"
    runs-on: Agent-1
    needs: sonarqube
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'reports/trivy-fs-report.txt'

