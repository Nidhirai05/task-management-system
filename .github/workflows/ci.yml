name: CI pipeline

on:
  push:
    branches: [ "main" ]

jobs:
 security:

    runs-on: self-hosted

    steps:

    #########################################################
    # Checkout Source Code
    #########################################################

    - name: Checkout Repository
      uses: actions/checkout@v4

    #########################################################
    # Setup Java 21
    #########################################################

    - name: Setup Java

      uses: actions/setup-java@v4

      with:

        distribution: temurin

        java-version: 21

        cache: maven

    #########################################################
    # Setup Node.js
    #########################################################

    - name: Setup Node

      uses: actions/setup-node@v4

      with:

        node-version: 22

        cache: npm

        cache-dependency-path: ./task-management-system-frontend/package-lock.json
 #########################################################
    # Verify Environment
    #########################################################

    - name: Verify Environment

      run: |
        docker --version
        java --version
        node --version
        mvn --version

